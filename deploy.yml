name: Deploy to GitHub Pages (auto-version)

# Jab bhi aap 'main' branch par push karein, ye workflow khud chalega:
# 1) sw.js ke andar __BUILD_ID__ ko is commit ke unique SHA se replace karega
#    (matlab CACHE_NAME khud-ba-khud badal jayega — manually kuch nahi karna).
# 2) Poora site GitHub Pages par publish kar dega.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Auto-bump CACHE_NAME in sw.js using this commit's SHA
        run: |
          sed -i "s/__BUILD_ID__/${GITHUB_SHA::8}/g" sw.js
          echo "Naya cache version set ho gaya: smp-${GITHUB_SHA::8}"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
