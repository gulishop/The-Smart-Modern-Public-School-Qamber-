name: Deploy to GitHub Pages (auto-version)

# Jab bhi aap 'main' branch par push karein, ye workflow khud chalega:
# 1) sw.js ke andar __BUILD_ID__ ko is commit ke unique SHA se replace karega
#    (matlab CACHE_NAME khud-ba-khud badal jayega — manually kuch nahi karna).
# 1b) index.html ke andar __BUILD_ID__ (window.__APP_BUILD__) ko bhi isi SHA se
#    replace karega — is se pehle se installed PWA (jinke pass purana version
#    khula hua hai) khud-ba-khud detect kar ke naye version par reload ho jate hain.
# 2) index.html ke andar __GOOGLE_API_KEY__ ko GOOGLE_API_KEY secret se
#    replace karega (AI Notice feature ke liye — sirf yahi ek secret chahiye).
# 3) Poora site GitHub Pages par publish kar dega.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Auto-bump CACHE_NAME in sw.js and APP_BUILD in index.html using this commit's SHA
        run: |
          sed -i "s/__BUILD_ID__/${GITHUB_SHA::8}/g" sw.js
          sed -i "s/__BUILD_ID__/${GITHUB_SHA::8}/g" index.html
          echo "Naya cache version set ho gaya: smp-${GITHUB_SHA::8}"

      - name: Inject Google AI API key into index.html
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          sed -i "s/__GOOGLE_API_KEY__/${GOOGLE_API_KEY}/g" index.html
          echo "AI Notice feature ke liye API key bhar di gayi."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
